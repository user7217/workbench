[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workbench"
version = "0.1.0"
description = "Personal dashboard for tracking software projects and learning paths"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "ruamel.yaml>=0.18.6",
    "typer>=0.15.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "detect-secrets>=1.5.0",
]

[project.scripts]
workbench = "workbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.5.0",
    "playwright>=1.44.0",
    "respx>=0.21.1",
    "ruff>=0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

# packaging/hatch_build.py puts the built web UI (web/dist) into the wheel as workbench/web_dist
[tool.hatch.build.targets.wheel.hooks.custom]
path = "packaging/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "graphify-out"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors, import order, common bug patterns, modern syntax
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# typer reads option defaults from function signatures (B008 is the typer idiom)
"src/workbench/cli/*.py" = ["B008"]
