[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workbench"
version = "0.1.0"
description = "Personal dashboard for tracking software projects and learning paths"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7.0",
    "ruamel.yaml>=0.18.6",
    "typer>=0.12.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "detect-secrets>=1.5.0",
]

[project.scripts]
workbench = "workbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.5.0",
    "playwright>=1.44.0",
    "respx>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
