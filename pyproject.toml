[build-system]
requires = ["hatchling", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
# Published on PyPI as workbench-dashboard (the name workbench is taken there); the import package
# and the command are still `workbench`
name = "workbench-dashboard"
dynamic = ["version", "readme"]
description = "Personal dashboard of software projects and learning paths, kept current by coding agents"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "user7217" }]
keywords = ["dashboard", "project-tracking", "learning", "claude-code", "gemini-cli", "git"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "pydantic>=2.7.0",
    "ruamel.yaml>=0.18.6",
    "typer>=0.15.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "detect-secrets>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/user7217/workbench"
Documentation = "https://github.com/user7217/workbench#documentation-map"
Changelog = "https://github.com/user7217/workbench/blob/main/CHANGELOG.md"
Issues = "https://github.com/user7217/workbench/issues"

[project.scripts]
workbench = "workbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-playwright>=0.5.0",
    "playwright>=1.44.0",
    "respx>=0.21.1",
    "ruff>=0.17.3",
]

# The one place the version is written; scripts/version.py sets it and the app and UI versions
[tool.hatch.version]
path = "src/workbench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

# PyPI shows README.md, but it cannot follow the README's relative links and images, so the
# package description gets them rewritten to absolute GitHub URLs (images first, then links)
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '!\[(.*?)\]\((?!https?://)(.*?)\)'
replacement = '![\1](https://raw.githubusercontent.com/user7217/workbench/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)(.*?)\)'
replacement = '](https://github.com/user7217/workbench/blob/main/\1)'

# packaging/hatch_build.py puts the built web UI (web/dist) into the wheel as workbench/web_dist
[tool.hatch.build.targets.wheel.hooks.custom]
path = "packaging/hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web", "graphify-out"]

[tool.ruff.lint]
# pyflakes + pycodestyle errors, import order, common bug patterns, modern syntax
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# typer reads option defaults from function signatures (B008 is the typer idiom)
"src/workbench/cli/*.py" = ["B008"]
