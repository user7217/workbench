# Checks every push and pull request. The test suites are kept out of the repository, so CI
# lints, type-checks, builds, and smoke-tests the installed package on each OS instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web

  web:
    name: Web UI and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: web
      # schema/ and web/src/types/ are generated from models.py and must be committed up to date
      - run: make schema
      - run: git diff --exit-code -- schema web/src/types
      - run: npx tsc --noEmit -p .
        working-directory: web
      - run: npm run typecheck:look
        working-directory: web
      - run: npm run build
        working-directory: web

  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the UI and the wheel
        run: |
          (cd web && npm ci && npm run build)
          uv build --wheel -o dist
      - name: The wheel ships the UI and the agent files
        run: |
          uv run --no-project python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for required in ("workbench/web_dist/index.html",
                           "workbench/agents/assets/claude/workbench-update/SKILL.md",
                           "workbench/agents/assets/gemini/GEMINI.md"):
              assert required in names, f"missing from wheel: {required}"
          print(f"wheel ok ({len(names)} files)")
          EOF
      - name: Install the wheel in a clean environment
        run: |
          uv venv --python 3.13 ../clean
          VIRTUAL_ENV=../clean uv pip install dist/*.whl
          echo "WB=$(cd ../clean && pwd)/$([ "$RUNNER_OS" = Windows ] && echo Scripts/workbench.exe || echo bin/workbench)" >> "$GITHUB_ENV"
      - name: Smoke-test the installed CLI
        run: |
          home="$RUNNER_TEMP/wb-home"
          mkdir -p "$home"
          "$WB" --help > /dev/null
          "$WB" install --home "$home" --claude --gemini
          test -f "$home/.claude/skills/workbench-update/SKILL.md"
          test -f "$home/.gemini/GEMINI.md"
      - name: Smoke-test the dashboard server
        if: runner.os == 'Linux'
        run: |
          demo="$RUNNER_TEMP/wb-demo"
          "$WB" demo init "$demo"
          # The demo's fake laptop has a config.toml pointing at the demo's local data repo
          HOME="$demo/laptop" "$WB" serve --port 8499 > "$RUNNER_TEMP/serve.log" 2>&1 &
          server=$!
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:8499/api/status > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8499/api/status | grep -q '"last_error":null' || { cat "$RUNNER_TEMP/serve.log"; exit 1; }
          curl -sf http://127.0.0.1:8499/ | grep -q "<title>Workbench</title>"
          kill "$server"

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: false
          tags: workbench:ci
