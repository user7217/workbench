services:
  workbench:
    # A released image: packaging/docker/update.sh moves the server to each new release (see
    # docs/setup.md 2.8), and WORKBENCH_VERSION in .env pins one (e.g. 0.1.0).
    # `docker compose up -d --build` builds it from this checkout instead
    image: ghcr.io/user7217/workbench:${WORKBENCH_VERSION:-latest}
    build:
      context: .
      dockerfile: packaging/docker/Dockerfile
    container_name: workbench-server
    restart: unless-stopped
    environment:
      WORKBENCH_DATA_REMOTE: ${WORKBENCH_DATA_REMOTE:?Set WORKBENCH_DATA_REMOTE in .env}
      WORKBENCH_BRANCH: ${WORKBENCH_BRANCH:-main}
      WORKBENCH_POLL_SECONDS: ${WORKBENCH_POLL_SECONDS:-600}
      WORKBENCH_GITHUB_OWNERS: ${WORKBENCH_GITHUB_OWNERS:-}
      WORKBENCH_GITHUB_READ_TOKEN: ${WORKBENCH_GITHUB_READ_TOKEN:-}
      WORKBENCH_STATE_DIR: /data
      WORKBENCH_BIND: 0.0.0.0
      WORKBENCH_PORT: 8420
    ports:
      # Bind to the server's Tailscale IP in production (WORKBENCH_BIND=100.x.y.z in .env)
      - "${WORKBENCH_BIND:-127.0.0.1}:8420:8420"
    volumes:
      - workbench-data:/data
      # Deploy key with write access to the workbench-data repo only (see docs/setup.md).
      # GitHub's host keys are built into the image; mount your own known_hosts at
      # /root/.ssh/known_hosts only if the data repo is on another git host.
      - ${WORKBENCH_SSH_KEY_PATH:-./secrets/deploy_key}:/root/.ssh/id_ed25519:ro

volumes:
  workbench-data:
